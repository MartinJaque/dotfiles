general.import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]

[env]
    TERM="xterm-256color"


[window]
    decorations = "Full"
    opacity = 0.95
    dynamic_title = true
    decorations_theme_variant = "None"

[font]
    normal = { family="Iosevka Nerd Font Mono", style="Regular" }
    size = 13


[selection]
    save_to_clipboard=true

[cursor]
    style={shape="Block", blinking= "On"}

